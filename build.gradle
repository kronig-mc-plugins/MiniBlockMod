// This is a minimal setup of a Forge mod workspace.
// For complex examples (including AccessTransformers, Jar-in-Jar, and Mixin), see our examples repository.
// https://github.com/MinecraftForge/MDKExamples

plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'net.minecraftforge.gradle' version '[7.0.17,8)'
}

version = '0.3.0'
group = 'de.niklas.miniblock'

// Mojang ships Java 25 to end users in 26.1+, so your mod should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// Include generated resources
sourceSets.main.resources { srcDir 'src/generated/resources' }

minecraft {
    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')

            systemProperty 'eventbus.api.strictRuntimeChecks', 'true'
            // Directory-based development runs do not read the playable JAR's manifest.
            args '--mixin', 'miniblock.mixins.json'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer') {
            args '--tests', 'miniblock:*'
        }

        register('data') {
            workingDir = layout.projectDirectory.dir('run-data')

            args '--mod', 'miniblock', '--all', '--output', layout.projectDirectory.dir('src/generated/resources'), '--existing', layout.projectDirectory.dir('src/main/resources')
        }
    }
}

repositories {
    minecraft.mavenizer(it) // In Kotlin, it = this
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.3-66.0.9')
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.6'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') { useJUnitPlatform() }

// Test functions and structures are loaded in development, and omitted from the playable JAR.
tasks.named('jar') {
    manifest.attributes('MixinConfigs': 'miniblock.mixins.json')
    exclude 'de/niklas/miniblock/gametest/**'
    exclude 'de/niklas/miniblock/player/PlayerScaleGameTests*'
    exclude 'data/miniblock/test_instance/**'
    exclude 'data/miniblock/structure/empty_3x3x3.nbt'
}

tasks.withType(JavaCompile).configureEach {
    // Use the UTF-8 charset for Java compilation
    // This is done by default in Java 18+, but this ensures it no matter the Java or Gradle version
    options.encoding = 'UTF-8'
}
