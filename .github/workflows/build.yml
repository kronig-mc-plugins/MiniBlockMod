name: Build and tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Java 25 / Forge 26.3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java 25
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Build, unit tests and Minecraft integration tests
        run: ./gradlew --no-daemon build runGameTestServer

      - name: Upload mod JAR
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MiniBlockMod-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30

      - name: Upload test reports and game logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Test-reports-${{ github.sha }}
          path: |
            build/reports/tests/
            build/test-results/
            run/logs/
          if-no-files-found: ignore
          retention-days: 14
